events {}

http {
    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    log_format cache_log '$remote_addr "$request" $status '
                         'next_cache=$upstream_http_x_nextjs_cache '
                         'proxy_cache=$upstream_http_x_cache';

    # HTTP — serve directly on port 8083 (no redirect, also accessible without HTTPS)
    server {
        listen 8083;
        access_log /var/log/nginx/access.log cache_log;

        location / {
            set $upstream_frontend http://frontend:3000;
            proxy_pass         $upstream_frontend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host               $http_host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $http_host;

            proxy_read_timeout 60s;
        }
    }
}
