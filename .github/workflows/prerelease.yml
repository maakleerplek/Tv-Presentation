name: Prerelease on PR

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write  # needed to create tags and releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Run tests first ────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install data-fetcher deps
        run: bun install
        working-directory: data-fetcher

      - name: Run data-fetcher tests
        run: bun test
        working-directory: data-fetcher

      - name: Install frontend deps
        run: bun install
        working-directory: "Reworked website"

      - name: Run frontend tests
        run: bun test
        working-directory: "Reworked website"

  # ── Create / update the prerelease ────────────────────────────────────────
  prerelease:
    name: Create Prerelease
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or move tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "${{ steps.tag.outputs.tag }}" 2>/dev/null || true
          git push origin ":refs/tags/${{ steps.tag.outputs.tag }}" 2>/dev/null || true
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Delete previous prereleases for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName,isPrerelease \
            | jq -r ".[] | select(.isPrerelease and (.tagName | startswith(\"pr-${{ github.event.pull_request.number }}-\"))) | .tagName" \
            | while read OLD_TAG; do
                gh release delete "${OLD_TAG}" --yes 2>/dev/null || true
                git push origin ":refs/tags/${OLD_TAG}" 2>/dev/null || true
              done

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.head_ref }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |-
          SHORT_SHA=$(git rev-parse --short HEAD)
          printf 'Prerelease for PR #%s\n\nBranch: %s\nCommit: %s\nPR: %s\n\nThis prerelease is updated on every push to the PR branch.\nIt will be superseded by a full release when the PR is merged into master.\n' \
            "${PR_NUMBER}" "${PR_BRANCH}" "${SHORT_SHA}" "${PR_URL}" > /tmp/release-notes.md
          gh release create "${RELEASE_TAG}" \
            --prerelease \
            --title "PR #${PR_NUMBER} -- ${PR_TITLE}" \
            --notes-file /tmp/release-notes.md
