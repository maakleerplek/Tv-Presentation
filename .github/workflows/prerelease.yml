name: Prerelease

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Run tests first ────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install data-fetcher deps
        run: bun install
        working-directory: data-fetcher

      - name: Run data-fetcher tests
        run: bun test
        working-directory: data-fetcher

      - name: Install frontend deps
        run: bun install
        working-directory: "Reworked website"

      - name: Run frontend tests
        run: bun test
        working-directory: "Reworked website"

  # ── Create / update the prerelease ────────────────────────────────────────
  prerelease:
    name: Create Prerelease
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        run: |-
          SHORT_SHA=$(git rev-parse --short HEAD)
          EVENT="${{ github.event_name }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ "${EVENT}" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            TAG="pr-${PR_NUMBER}-${SHORT_SHA}"
            TITLE="PR #${PR_NUMBER} -- ${{ github.event.pull_request.title }}"
            PREFIX="pr-${PR_NUMBER}-"
            SOURCE="PR #${PR_NUMBER} (${{ github.event.pull_request.html_url }})"
            BRANCH="${{ github.head_ref }}"
          else
            TAG="master-${SHORT_SHA}"
            TITLE="master ${SHORT_SHA}"
            PREFIX="master-"
            SOURCE="Direct push to master"
            BRANCH="master"
          fi

          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}"   >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create or move tag
        run: |-
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "${{ steps.meta.outputs.tag }}" 2>/dev/null || true
          git push origin ":refs/tags/${{ steps.meta.outputs.tag }}" 2>/dev/null || true
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Delete previous prereleases with same prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |-
          gh release list --json tagName,isPrerelease \
            | jq -r ".[] | select(.isPrerelease and (.tagName | startswith(\"${PREFIX}\"))) | .tagName" \
            | while read OLD_TAG; do
                gh release delete "${OLD_TAG}" --yes 2>/dev/null || true
                git push origin ":refs/tags/${OLD_TAG}" 2>/dev/null || true
              done

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
          SOURCE: ${{ steps.meta.outputs.source }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |-
          printf 'Source: %s\nBranch: %s\nCommit: %s\n\nThis prerelease is created automatically and updated on every push.\n' \
            "${SOURCE}" "${BRANCH}" "${SHA}" > /tmp/release-notes.md
          gh release create "${RELEASE_TAG}" \
            --prerelease \
            --title "${RELEASE_TITLE}" \
            --notes-file /tmp/release-notes.md
