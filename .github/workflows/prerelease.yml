name: Prerelease on PR

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write  # needed to create tags and releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Run tests first ────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install data-fetcher deps
        run: bun install
        working-directory: data-fetcher

      - name: Run data-fetcher tests
        run: bun test
        working-directory: data-fetcher

      - name: Install frontend deps
        run: bun install
        working-directory: "Reworked website"

      - name: Run frontend tests
        run: bun test
        working-directory: "Reworked website"

  # ── Create / update the prerelease ────────────────────────────────────────
  prerelease:
    name: Create Prerelease
    runs-on: ubuntu-latest
    needs: test  # only publish if tests pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can create tags

      - name: Compute release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="pr-${{ github.event.pull_request.number }}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag will be: ${TAG}"

      - name: Create or move tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete the tag locally + remotely if it already exists (re-push)
          git tag -d "${{ steps.tag.outputs.tag }}" 2>/dev/null || true
          git push origin ":refs/tags/${{ steps.tag.outputs.tag }}" 2>/dev/null || true
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Delete previous prerelease for this PR (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all prereleases whose tag starts with "pr-<PR number>-"
          gh release list --json tagName,isDraft,isPrerelease \
            | jq -r ".[] | select(.isPrerelease and (.tagName | startswith(\"pr-${{ github.event.pull_request.number }}-\"))) | .tagName" \
            | while read OLD_TAG; do
                echo "Deleting old prerelease ${OLD_TAG}"
                gh release delete "${OLD_TAG}" --yes 2>/dev/null || true
                git push origin ":refs/tags/${OLD_TAG}" 2>/dev/null || true
              done

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          TAG="${{ steps.tag.outputs.tag }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          gh release create "${TAG}" \
            --prerelease \
            --title "PR #${PR_NUMBER} — ${PR_TITLE}" \
            --notes "## Prerelease for PR #${PR_NUMBER}

**Branch:** \`${{ github.head_ref }}\`  
**Commit:** \`${SHORT_SHA}\`  
**PR:** ${PR_URL}

> This prerelease is automatically updated each time the PR branch is pushed to.
> It will be superseded by a full release when the PR is merged into \`master\`."
