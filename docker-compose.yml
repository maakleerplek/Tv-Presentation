services:
  # ===== Astro Frontend =====
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tv-frontend
    restart: unless-stopped
    ports:
      - "${HOST_IP:-0.0.0.0}:${HOST_PORT:-8083}:80"
      - "${HOST_IP:-0.0.0.0}:${HTTPS_PORT:-8443}:443"

