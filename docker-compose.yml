services:
  # ===== SvelteKit Frontend =====
  frontend:
    build:
      context: ./Tv-presentation
      dockerfile: Dockerfile
    container_name: tv-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./Tv-presentation/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/local.db
    volumes:
      # Persist the local SQLite database
      - tv-data:/app/data

