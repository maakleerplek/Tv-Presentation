services:
  # ===== Astro Frontend =====
  frontend:
    build:
      context: ./Tv-presentation
      dockerfile: Dockerfile
    container_name: tv-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8083}:80"

  # ===== Data Fetcher Backend =====
  data-fetcher:
    build:
      context: ./Data-fetcher
      dockerfile: Dockerfile
    container_name: tv-data-fetcher
    restart: unless-stopped
    ports:
      - "8085:8080"

