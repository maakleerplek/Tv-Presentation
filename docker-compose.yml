services:
  # ===== nginx Reverse Proxy =====
  # HTTP:  http://<HOST_IP>  (port 80)  or  http://<HOST_IP>:8083
  # HTTPS: https://<HOST_IP>:8443
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        HOST_IP: ${HOST_IP:-10.72.3.141}
    container_name: tv-nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8083}:8083"
    depends_on:
      - frontend
    mem_limit: 64m

  # ===== Next.js Frontend (Reworked Website) =====
  frontend:
    build:
      context: "./Reworked website"
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_ vars are inlined at build time by Next.js — must be passed as build args
        NEXT_PUBLIC_SCREEN_DATA_POLL_MINUTES: ${NEXT_PUBLIC_SCREEN_DATA_POLL_MINUTES:-5}
    container_name: tv-frontend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - next-image-cache:/app/.next/cache/images
      # The SQLite database holds the changelog, the custom news items and the
      # admin credentials. Without this volume it lives in the container's
      # writable layer, and every `up --build` throws all of it away.
      - tv-db:/app/data
    # No ports exposed to the host — only nginx can reach this on the internal Docker network
    # The server has 3 GB for every stack: a runaway container may not take the rest.
    mem_limit: 768m

  # ===== Data Fetcher Backend (Node.js Scraper) =====
  data-fetcher:
    build:
      context: ./data-fetcher
      dockerfile: Dockerfile
    container_name: tv-data-fetcher
    restart: unless-stopped
    env_file:
      - .env
    # Localhost only: the API needs no outside callers, and its image proxy
    # talks to InvenTree with the token.
    ports:
      - "127.0.0.1:8085:8080"
    mem_limit: 256m

volumes:
  next-image-cache:
  tv-db:
