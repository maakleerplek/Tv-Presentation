services:
  # ===== Next.js Frontend (Reworked Website) =====
  frontend:
    build:
      context: "./Reworked website"
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_ vars are inlined at build time by Next.js — must be passed as build args
        NEXT_PUBLIC_SCREEN_DATA_POLL_MINUTES: ${NEXT_PUBLIC_SCREEN_DATA_POLL_MINUTES:-5}
    container_name: tv-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8083}:3000"

  # ===== Data Fetcher Backend (Node.js Scraper) =====
  data-fetcher:
    build:
      context: ./data-fetcher
      dockerfile: Dockerfile
    container_name: tv-data-fetcher
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8085:8080"
